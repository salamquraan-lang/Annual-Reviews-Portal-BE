[project]
name = "annual-reviews-portal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2,<0.163.0",
    "uvicorn>=0.54.0,<0.55.0",
    "sqlalchemy>=2.1.8,<3.0.0",
    "pymysql>=1.2.4,<2.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "alembic>=1.20.1,<2.0.0",
    "pydantic>=2.14.3,<3.0.0",
    "pydantic-settings>=2.16.2,<3.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "bcrypt>=5.0.0,<6.0.0",
    "pyjwt>=2.15.1,<3.0.0",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (==9.1.1)",
    "httpx2 (==2.16.0)",
    "ruff (==0.17.2)"
]
